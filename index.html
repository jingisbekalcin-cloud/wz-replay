<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>王者全英雄复盘-严谨分类版</title>
    <style>
        :root { --primary: #fbda30; --bg: #0b1320; }
        body { margin: 0; background: var(--bg); color: white; font-family: sans-serif; touch-action: none; overflow: hidden; }
        header { text-align: center; padding: 10px; font-weight: bold; background: #020617; border-bottom: 1px solid #333; }
        
        .tools { display: flex; gap: 8px; justify-content: center; padding: 10px; background: #020617; }
        .btn { background: #1e293b; color: white; border: none; padding: 8px 12px; border-radius: 6px; font-size: 13px; }
        .btn-active { background: var(--primary); color: #000; font-weight: bold; }

        #board {
            position: relative; width: 95vw; height: 53.4vw; 
            max-width: 800px; max-height: 450px;
            margin: 10px auto;
            background: #1c2a43 url('map.jpg') no-repeat;
            background-size: 100% 100%; border: 1px solid #444;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .hero {
            position: absolute; width: 44px; height: 44px;
            border-radius: 50%; border: 2px solid #fff;
            z-index: 100; background-size: cover; background-color: #333;
            display: flex; align-items: center; justify-content: center; font-size: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5); font-weight: bold;
        }

        .hero-section {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: #1a1a1a; border-top: 2px solid #333;
            display: flex; flex-direction: column; height: 130px;
        }
        .tabs { display: flex; overflow-x: auto; background: #000; padding: 8px; gap: 10px; -webkit-overflow-scrolling: touch; }
        .tab { padding: 4px 12px; font-size: 13px; border-radius: 4px; white-space: nowrap; background: #333; color: #ccc; }
        .tab-active { background: var(--primary); color: #000; font-weight: bold; }
        
        .hero-list { display: flex; overflow-x: auto; gap: 12px; padding: 10px; align-items: center; flex: 1; }
        .hero-item { width: 55px; height: 55px; border-radius: 50%; border: 2px solid #444; flex-shrink: 0; object-fit: cover; }
    </style>
</head>
<body>

<header>王者复盘工具 S40 严谨版</header>

<div class="tools">
    <button class="btn btn-active" id="dragBtn" onclick="setMode('drag')">🖐️ 拖动</button>
    <button class="btn" id="drawBtn" onclick="setMode('draw')">✏️ 画笔</button>
    <button class="btn" onclick="clearAll()" style="background:#7f1d1d;">🗑️ 清空</button>
</div>

<div id="board">
    <canvas id="paint-canvas" style="position:absolute; top:0; left:0; pointer-events:none;"></canvas>
</div>

<div class="hero-section">
    <div class="tabs" id="tabs">
        <div class="tab tab-active" onclick="filterHeroes('全部')">全部</div>
        <div class="tab" onclick="filterHeroes('坦克')">坦克</div>
        <div class="tab" onclick="filterHeroes('战士')">战士</div>
        <div class="tab" onclick="filterHeroes('打野')">打野</div>
        <div class="tab" onclick="filterHeroes('法师')">法师</div>
        <div class="tab" onclick="filterHeroes('射手')">射手</div>
        <div class="tab" onclick="filterHeroes('辅助')">辅助</div>
    </div>
    <div class="hero-list" id="hero-list"></div>
</div>

<script>
    const board = document.getElementById('board');
    const canvas = document.getElementById('paint-canvas');
    const ctx = canvas.getContext('2d');
    let mode = 'drag';

    // 严谨整合名单
    const heroes = [
        // 坦克
        { name: "廉颇", role: "坦克" }, { name: "牛魔", role: "坦克" }, { name: "张飞", role: "坦克" }, 
        { name: "白起", role: "坦克" }, { name: "项羽", role: "坦克" }, { name: "刘邦", role: "坦克" }, 
        { name: "东皇太一", role: "坦克" }, { name: "苏烈", role: "坦克" }, { name: "猪八戒", role: "坦克" }, 
        { name: "蒙恬", role: "坦克" }, { name: "盾山", role: "坦克" }, { name: "阿古朵", role: "坦克" },
        { name: "元流之子（坦克）", role: "坦克" },
        // 战士
        { name: "亚瑟", role: "战士" }, { name: "曹操", role: "战士" }, { name: "典韦", role: "战士" }, 
        { name: "铠", role: "战士" }, { name: "狂铁", role: "战士" }, { name: "孙策", role: "战士" }, 
        { name: "吕布", role: "战士" }, { name: "关羽", role: "战士" }, { name: "达摩", role: "战士" }, 
        { name: "花木兰", role: "战士" }, { name: "老夫子", role: "战士" }, { name: "程咬金", role: "战士" }, 
        { name: "钟无艳", role: "战士" }, { name: "刘备", role: "战士" }, { name: "盘古", role: "战士" }, 
        { name: "曜", role: "战士" }, { name: "姬小满", role: "战士" }, { name: "司空震", role: "战士" }, 
        { name: "云缨", role: "战士" }, { name: "影", role: "战士" }, { name: "大禹", role: "战士" },
        { name: "元流之子（战士）", role: "战士" },
        // 打野
        { name: "阿轲", role: "打野" }, { name: "李白", role: "打野" }, { name: "韩信", role: "打野" }, 
        { name: "兰陵王", role: "打野" }, { name: "娜可露露", role: "打野" }, { name: "橘右京", role: "打野" }, 
        { name: "百里玄策", role: "打野" }, { name: "裴擒虎", role: "打野" }, { name: "云中君", role: "打野" }, 
        { name: "镜", role: "打野" }, { name: "澜", role: "打野" }, { name: "赵怀真", role: "打野" }, 
        { name: "司马懿", role: "打野" }, { name: "暃", role: "打野" },
        // 法师
        { name: "妲己", role: "法师" }, { name: "安琪拉", role: "法师" }, { name: "王昭君", role: "法师" }, 
        { name: "甄姬", role: "法师" }, { name: "小乔", role: "法师" }, { name: "周瑜", role: "法师" }, 
        { name: "张良", role: "法师" }, { name: "诸葛亮", role: "法师" }, { name: "貂蝉", role: "法师" }, 
        { name: "高渐离", role: "法师" }, { name: "嬴政", role: "法师" }, { name: "女娲", role: "法师" }, 
        { name: "姜子牙", role: "法师" }, { name: "沈梦溪", role: "法师" }, { name: "米莱狄", role: "法师" }, 
        { name: "西施", role: "法师" }, { name: "上官婉儿", role: "法师" }, { name: "弈星", role: "法师" }, 
        { name: "金蝉", role: "法师" }, { name: "海月", role: "法师" }, { name: "嫦娥", role: "法师" }, 
        { name: "武则天", role: "法师" }, { name: "海诺", role: "法师" }, { name: "不知火舞", role: "法师" },
        { name: "元流之子（法师）", role: "法师" },
        // 射手
        { name: "后羿", role: "射手" }, { name: "鲁班七号", role: "射手" }, { name: "狄仁杰", role: "射手" }, 
        { name: "孙尚香", role: "射手" }, { name: "马可波罗", role: "射手" }, { name: "虞姬", role: "射手" }, 
        { name: "李元芳", role: "射手" }, { name: "百里守约", role: "射手" }, { name: "公孙离", role: "射手" }, 
        { name: "黄忠", role: "射手" }, { name: "蒙犽", role: "射手" }, { name: "艾琳", role: "射手" }, 
        { name: "戈娅", role: "射手" }, { name: "莱西奥", role: "射手" }, { name: "敖隐", role: "射手" },
        { name: "元流之子（射手）", role: "射手" },
        // 辅助
        { name: "蔡文姬", role: "辅助" }, { name: "孙膑", role: "辅助" }, { name: "庄周", role: "辅助" }, 
        { name: "大乔", role: "辅助" }, { name: "明世隐", role: "辅助" }, { name: "太乙真人", role: "辅助" }, 
        { name: "鬼谷子", role: "辅助" }, { name: "鲁班大师", role: "辅助" }, { name: "瑶", role: "辅助" }, 
        { name: "桑启", role: "辅助" }, { name: "刘禅", role: "辅助" }, { name: "钟馗", role: "辅助" },
        { name: "朵莉亚", role: "辅助" }, { name: "少司缘", role: "辅助" }, { name: "大司命", role: "辅助" },
        { name: "元流之子（辅助）", role: "辅助" }
    ];

    function init() {
        canvas.width = board.clientWidth;
        canvas.height = board.clientHeight;
        ctx.strokeStyle = '#fbda30';
        ctx.lineWidth = 4;
        filterHeroes('全部');
    }

    function filterHeroes(role) {
        const list = document.getElementById('hero-list');
        list.innerHTML = '';
        document.querySelectorAll('.tab').forEach(t => t.className = t.innerText === role ? 'tab tab-active' : 'tab');

        const filtered = role === '全部' ? heroes : heroes.filter(h => h.role.includes(role));
        filtered.forEach(h => {
            const img = document.createElement('img');
            img.src = h.name + '.jpg'; 
            img.className = 'hero-item';
            img.onclick = () => addHero(img.src, h.name);
            img.onerror = () => {
                const div = document.createElement('div');
                div.className = 'hero-item';
                div.style.background = '#333'; div.style.display = 'flex';
                div.style.alignItems = 'center'; div.style.justifyContent = 'center';
                div.style.fontSize = '9px'; div.innerText = h.name; div.style.textAlign = 'center';
                div.onclick = () => addHero('', h.name);
                list.appendChild(div);
                img.remove();
            };
            list.appendChild(img);
        });
    }

    function addHero(src, name) {
        const div = document.createElement('div');
        div.className = 'hero';
        div.style.left = '45%'; div.style.top = '40%';
        if(src) div.style.backgroundImage = `url('${src}')`;
        else div.innerText = name;
        board.appendChild(div);
        
        let move = false;
        div.onmousedown = div.ontouchstart = (e) => { 
            if(mode==='drag') { move=true; div.style.zIndex=2000; }
        };
        window.onmousemove = window.ontouchmove = (e) => {
            if(!move) return;
            const evt = e.touches ? e.touches[0] : e;
            const r = board.getBoundingClientRect();
            div.style.left = (evt.clientX - r.left - 22) + 'px';
            div.style.top = (evt.clientY - r.top - 22) + 'px';
        };
        window.onmouseup = window.ontouchend = () => move = false;
    }

    function setMode(m) {
        mode = m;
        document.getElementById('dragBtn').className = m === 'drag' ? 'btn btn-active' : 'btn';
        document.getElementById('drawBtn').className = m === 'draw' ? 'btn btn-active' : 'btn';
        canvas.style.pointerEvents = m === 'draw' ? 'auto' : 'none';
    }

    let drawing = false;
    board.onpointerdown = (e) => { if(mode==='draw'){ drawing=true; ctx.beginPath(); ctx.moveTo(e.offsetX, e.offsetY); }};
    board.onpointermove = (e) => { if(drawing){ ctx.lineTo(e.offsetX, e.offsetY); ctx.stroke(); }};
    board.onpointerup = () => drawing = false;

    function clearAll() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        document.querySelectorAll('.hero').forEach(h => h.remove());
    }
    window.onload = init;
</script>
</body>
</html>
