<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>王者复盘-红蓝对阵版</title>
    <style>
        :root { --primary: #fbda30; --bg: #0b1320; --blue: #008cff; --red: #ff3e3e; }
        body { margin: 0; background: var(--bg); color: white; font-family: sans-serif; touch-action: none; overflow: hidden; }
        header { text-align: center; padding: 10px; font-weight: bold; background: #020617; border-bottom: 1px solid #333; font-size: 14px; }
        
        .tools { display: flex; gap: 5px; justify-content: center; padding: 10px; background: #020617; flex-wrap: wrap; }
        .btn { background: #1e293b; color: white; border: none; padding: 8px 10px; border-radius: 6px; font-size: 12px; }
        .btn-active { background: var(--primary); color: #000; font-weight: bold; }

        #board {
            position: relative; width: 95vw; height: 53.4vw; max-width: 800px; max-height: 450px;
            margin: 5px auto; background: #1c2a43 url('map.jpg') no-repeat;
            background-size: 100% 100%; border: 1px solid #444; overflow: hidden;
        }

        .unit {
            position: absolute; border-radius: 50%; z-index: 100; 
            background-size: cover; background-position: center; background-color: #333;
            display: flex; align-items: center; justify-content: center; font-weight: bold;
            box-shadow: 0 0 8px rgba(0,0,0,0.6);
        }
        /* 英雄样式 */
        .hero { width: 42px; height: 42px; border: 3px solid var(--blue); font-size: 9px; }
        .hero.red-side { border-color: var(--red); }
        /* 兵线样式 */
        .minion { width: 26px; height: 26px; font-size: 10px; }
        .minion.blue-minion { border: 2px solid var(--blue); color: var(--blue); }
        .minion.red-minion { border: 2px solid var(--red); color: var(--red); }

        .hero-section {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: #1a1a1a; border-top: 2px solid #333;
            display: flex; flex-direction: column; height: 130px;
        }
        .tabs { display: flex; overflow-x: auto; background: #000; padding: 8px; gap: 10px; }
        .tab { padding: 4px 12px; font-size: 13px; border-radius: 4px; white-space: nowrap; background: #333; }
        .tab-active { background: var(--primary); color: #000; }
        .hero-list { display: flex; overflow-x: auto; gap: 12px; padding: 10px; align-items: center; flex: 1; }
        .hero-item { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #444; flex-shrink: 0; background-size: cover; background-position: center; }
    </style>
</head>
<body>

<header>王者复盘 | 蓝红对阵·兵线·橡皮擦</header>

<div class="tools">
    <button class="btn btn-active" id="dragBtn" onclick="setMode('drag')">🖐️ 拖动</button>
    <button class="btn" id="drawBtn" onclick="setMode('draw')">✏️ 画笔</button>
    <button class="btn" id="eraseBtn" onclick="setMode('erase')">🧽 橡皮</button>
    <button class="btn" onclick="addMinion('blue')" style="background:#1e3a8a;">🤖 蓝兵</button>
    <button class="btn" onclick="addMinion('red')" style="background:#7f1d1d;">🤖 红兵</button>
    <button class="btn" onclick="clearAll()" style="background:#334155;">🗑️ 全清</button>
</div>

<div id="board">
    <canvas id="paint-canvas" style="position:absolute; top:0; left:0; pointer-events:none;"></canvas>
</div>

<div class="hero-section">
    <div class="tabs" id="tabs">
        <div class="tab tab-active" onclick="filterHeroes('全部')">全部</div>
        <div class="tab" onclick="filterHeroes('坦克')">坦克</div>
        <div class="tab" onclick="filterHeroes('战士')">战士</div>
        <div class="tab" onclick="filterHeroes('打野')">打野</div>
        <div class="tab" onclick="filterHeroes('法师')">法师</div>
        <div class="tab" onclick="filterHeroes('射手')">射手</div>
        <div class="tab" onclick="filterHeroes('辅助')">辅助</div>
    </div>
    <div class="hero-list" id="hero-list"></div>
</div>

<script>
    const board = document.getElementById('board');
    const canvas = document.getElementById('paint-canvas');
    const ctx = canvas.getContext('2d');
    let mode = 'drag';

    const heroes = [
        { name: "大禹", role: "战士" }, { name: "影", role: "战士" }, { name: "少司缘", role: "辅助" }, { name: "大司命", role: "辅助" }, { name: "敖隐", role: "射手" }, { name: "海诺", role: "法师" }, { name: "朵莉亚", role: "辅助" }, { name: "元流之子（坦克）", role: "坦克" }, { name: "元流之子（战士）", role: "战士" }, { name: "元流之子（法师）", role: "法师" }, { name: "元流之子（射手）", role: "射手" }, { name: "元流之子（辅助）", role: "辅助" },
        { name: "廉颇", role: "坦克" }, { name: "张飞", role: "坦克" }, { name: "铠", role: "战士" }, { name: "亚瑟", role: "战士" }, { name: "李白", role: "打野" }, { name: "韩信", role: "打野" }, { name: "妲己", role: "法师" }, { name: "安琪拉", role: "法师" }, { name: "后羿", role: "射手" }, { name: "鲁班七号", role: "射手" }, { name: "瑶", role: "辅助" }, { name: "蔡文姬", role: "辅助" }
    ];

    function init() {
        canvas.width = board.clientWidth; canvas.height = board.clientHeight;
        ctx.lineJoin = 'round'; ctx.lineCap = 'round';
        filterHeroes('全部');
    }

    function filterHeroes(role) {
        const list = document.getElementById('hero-list');
        list.innerHTML = '';
        document.querySelectorAll('.tab').forEach(t => t.className = t.innerText === role ? 'tab tab-active' : 'tab');
        const filtered = role === '全部' ? heroes : heroes.filter(h => h.role === role);
        filtered.forEach(h => {
            const item = document.createElement('div');
            item.className = 'hero-item'; item.style.backgroundImage = `url('${h.name}.jpg')`;
            item.onclick = () => createUnit(h.name, 'hero');
            const imgCheck = new Image(); imgCheck.src = h.name + '.jpg';
            imgCheck.onerror = () => { item.innerText = h.name; item.style.fontSize = '9px'; item.style.background = '#333'; item.style.display = 'flex'; item.style.alignItems = 'center'; item.style.justifyContent = 'center'; };
            list.appendChild(item);
        });
    }

    function createUnit(name, type, side = 'blue') {
        const el = document.createElement('div');
        el.className = `unit ${type}`;
        el.style.left = (side === 'blue' ? 20 : 70) + '%'; 
        el.style.top = (side === 'blue' ? 70 : 20) + '%';
        
        if(type === 'hero') {
            el.style.backgroundImage = `url('${name}.jpg')`;
            const imgCheck = new Image(); imgCheck.src = name + '.jpg';
            imgCheck.onerror = () => el.innerText = name;
            el.addEventListener('click', (e) => { if(mode === 'drag') el.classList.toggle('red-side'); e.stopPropagation(); });
        } else {
            el.classList.add(side === 'blue' ? 'blue-minion' : 'red-minion');
            el.innerText = '兵';
        }

        el.addEventListener('dblclick', () => el.remove());
        board.appendChild(el);
        makeDraggable(el);
    }

    function addMinion(side) { createUnit('兵', 'minion', side); }

    function makeDraggable(el) {
        let isMoving = false;
        const start = () => { if(mode==='drag') { isMoving=true; el.style.zIndex=2000; } };
        const move = (e) => {
            if(!isMoving) return;
            const evt = e.touches ? e.touches[0] : e;
            const r = board.getBoundingClientRect();
            el.style.left = (evt.clientX - r.left - (el.offsetWidth/2)) + 'px';
            el.style.top = (evt.clientY - r.top - (el.offsetHeight/2)) + 'px';
        };
        const stop = () => isMoving = false;
        el.addEventListener('mousedown', start); el.addEventListener('touchstart', start);
        window.addEventListener('mousemove', move); window.addEventListener('touchmove', move, {passive:false});
        window.addEventListener('mouseup', stop); window.addEventListener('touchend', stop);
    }

    function setMode(m) {
        mode = m;
        document.querySelectorAll('.btn').forEach(b => b.classList.remove('btn-active'));
        document.getElementById(m + 'Btn') ? document.getElementById(m + 'Btn').classList.add('btn-active') : null;
        canvas.style.pointerEvents = (m === 'draw' || m === 'erase') ? 'auto' : 'none';
    }

    let drawing = false;
    board.addEventListener('pointerdown', (e) => {
        if(mode === 'draw' || mode === 'erase'){
            drawing = true; ctx.beginPath(); ctx.moveTo(e.offsetX, e.offsetY);
            ctx.globalCompositeOperation = mode === 'erase' ? 'destination-out' : 'source-over';
            ctx.strokeStyle = mode === 'erase' ? 'rgba(0,0,0,1)' : '#fbda30';
            ctx.lineWidth = mode === 'erase' ? 25 : 4;
        }
    });
    board.addEventListener('pointermove', (e) => { if(drawing){ ctx.lineTo(e.offsetX, e.offsetY); ctx.stroke(); }});
    board.addEventListener('pointerup', () => drawing = false);

    function clearAll() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        document.querySelectorAll('.unit').forEach(u => u.remove());
    }
    window.onload = init;
</script>
</body>
</html>
