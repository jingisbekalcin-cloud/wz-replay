<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>王者复盘-乱序兼容版</title>
    <style>
        :root { --primary: #fbda30; --bg: #0b1320; }
        body { margin: 0; background: var(--bg); color: white; font-family: sans-serif; touch-action: none; overflow: hidden; }
        header { text-align: center; padding: 10px; font-weight: bold; background: #020617; border-bottom: 1px solid #333; }
        .tools { display: flex; gap: 8px; justify-content: center; padding: 10px; background: #020617; }
        .btn { background: #1e293b; color: white; border: none; padding: 8px 15px; border-radius: 6px; font-size: 14px; }
        .btn-active { background: var(--primary); color: #000; font-weight: bold; }

        #board {
            position: relative; width: 95vw; height: 53.4vw; 
            max-width: 800px; max-height: 450px;
            margin: 10px auto;
            background: #1c2a43 url('map.jpg') no-repeat; /* 只要地图叫 map.jpg 就能加载 */
            background-size: 100% 100%; border: 1px solid #444;
        }

        .hero {
            position: absolute; width: 44px; height: 44px;
            border-radius: 50%; border: 2px solid #fff;
            z-index: 100; background-size: cover; background-color: #333;
        }

        .hero-bank {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: #1a1a1a; padding: 10px;
            display: flex; overflow-x: auto; gap: 12px;
            border-top: 2px solid #333; height: 75px; align-items: center;
        }
        .hero-item { 
            width: 55px; height: 55px; border-radius: 50%; 
            border: 2px solid #444; flex-shrink: 0; cursor: pointer;
        }
    </style>
</head>
<body>

<header>王者复盘工具 (图片自动匹配版)</header>

<div class="tools">
    <button class="btn btn-active" id="dragBtn" onclick="setMode('drag')">🖐️ 拖动</button>
    <button class="btn" id="drawBtn" onclick="setMode('draw')">✏️ 画笔</button>
    <button class="btn" onclick="clearAll()" style="background:#7f1d1d;">清空</button>
</div>

<div id="board">
    <canvas id="paint-canvas" style="position:absolute; top:0; left:0; pointer-events:none;"></canvas>
</div>

<div class="hero-bank" id="hero-bank"></div>

<script>
    const board = document.getElementById('board');
    const canvas = document.getElementById('paint-canvas');
    const ctx = canvas.getContext('2d');
    let mode = 'drag';

    function init() {
        canvas.width = board.clientWidth;
        canvas.height = board.clientHeight;
        ctx.strokeStyle = '#fbda30';
        ctx.lineWidth = 4;

        const bank = document.getElementById('hero-bank');
        
        // 智能扫描逻辑：自动尝试加载 100 到 600 之间的 ID
        for (let i = 100; i <= 600; i++) {
            const img = new Image();
            const fileName = i + '.jpg';
            img.src = fileName;
            img.className = 'hero-item';
            
            // 只有当图片真实存在于你的 GitHub 文件夹时，才显示出来
            img.onload = function() {
                img.onclick = () => addHero(fileName);
                bank.appendChild(img);
            };
            // 找不到的图片会自动忽略，不报错
        }
    }

    function addHero(src) {
        const div = document.createElement('div');
        div.className = 'hero';
        div.style.left = '45%'; div.style.top = '40%';
        div.style.backgroundImage = `url('${src}')`;
        board.appendChild(div);
        
        let move = false;
        div.onmousedown = div.ontouchstart = () => { if(mode==='drag') move=true; };
        window.onmousemove = window.ontouchmove = (e) => {
            if(!move) return;
            const evt = e.touches ? e.touches[0] : e;
            const r = board.getBoundingClientRect();
            div.style.left = (evt.clientX - r.left - 22) + 'px';
            div.style.top = (evt.clientY - r.top - 22) + 'px';
        };
        window.onmouseup = window.ontouchend = () => move = false;
    }

    function setMode(m) {
        mode = m;
        document.getElementById('dragBtn').className = m === 'drag' ? 'btn btn-active' : 'btn';
        document.getElementById('drawBtn').className = m === 'draw' ? 'btn btn-active' : 'btn';
        canvas.style.pointerEvents = m === 'draw' ? 'auto' : 'none';
    }

    let drawing = false;
    board.onpointerdown = (e) => { if(mode==='draw'){ drawing=true; ctx.beginPath(); ctx.moveTo(e.offsetX, e.offsetY); }};
    board.onpointermove = (e) => { if(drawing){ ctx.lineTo(e.offsetX, e.offsetY); ctx.stroke(); }};
    board.onpointerup = () => drawing = false;

    function clearAll() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        document.querySelectorAll('.hero').forEach(h => h.remove());
    }
    window.onload = init;
</script>
</body>
</html>
