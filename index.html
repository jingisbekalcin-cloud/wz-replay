<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>王者荣耀 S40 | 全英雄复盘板</title>
    <style>
        :root { --primary: #fbda30; --bg: #0b1320; }
        body { margin: 0; background: var(--bg); color: white; font-family: sans-serif; touch-action: none; overflow: hidden; }
        header { text-align: center; padding: 10px; font-weight: bold; background: #020617; font-size: 16px; border-bottom: 1px solid #333; }
        
        .tools { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 10px; background: #020617; }
        .btn { background: #1e293b; color: white; border: none; padding: 8px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; }
        .btn-active { background: var(--primary); color: #000; font-weight: bold; }

        #board {
            position: relative; width: 95vw; height: 53.4vw; /* 16:9 */
            max-width: 800px; max-height: 450px;
            margin: 10px auto;
            background: url('https://game.gtimg.cn/images/yxzj/img201605/summoner/map/map_5v5.jpg') no-repeat;
            background-size: 100% 100%; border: 1px solid #444;
        }

        .hero {
            position: absolute; width: 38px; height: 38px;
            border-radius: 50%; border: 2px solid #fff;
            box-shadow: 0 0 5px rgba(0,0,0,0.5); z-index: 100;
            background-size: cover; cursor: move; touch-action: none;
        }

        #paint-canvas { position: absolute; top: 0; left: 0; z-index: 50; pointer-events: none; }

        /* 英雄库容器：支持横向滚动 */
        .hero-bank {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: #1a1a1a; padding: 10px 5px;
            display: flex; overflow-x: auto; gap: 8px;
            border-top: 2px solid #333; height: 65px; align-items: center;
            -webkit-overflow-scrolling: touch;
        }
        .hero-item { width: 48px; height: 48px; border-radius: 50%; border: 1px solid #444; flex-shrink: 0; background-color: #333; }
        
        .hint { text-align: center; font-size: 11px; color: #555; margin-bottom: 80px; }
    </style>
</head>
<body>

<header>王者荣耀 S40 | 全英雄复盘工具</header>

<div class="tools">
    <button class="btn btn-active" id="dragBtn" onclick="setMode('drag')">🖐️ 移动英雄</button>
    <button class="btn" id="drawBtn" onclick="setMode('draw')">✏️ 战术画笔</button>
    <button class="btn" onclick="clearAll()" style="background:#7f1d1d;">🧹 清空重置</button>
</div>

<div id="board">
    <canvas id="paint-canvas"></canvas>
</div>

<div class="hint">左右滑动底部选择英雄 • 长按英雄可删除</div>

<div class="hero-bank" id="hero-bank">
    </div>

<script>
    const board = document.getElementById('board');
    const canvas = document.getElementById('paint-canvas');
    const ctx = canvas.getContext('2d');
    let mode = 'drag';

    function init() {
        canvas.width = board.clientWidth;
        canvas.height = board.clientHeight;
        ctx.strokeStyle = '#fbda30';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';

        // 王者全英雄 ID 列表（包含热门及大部分英雄）
        const allHeroIds = [
            105,106,107,108,109,110,111,112,113,114,115,116,117,118,119,120,
            121,123,124,125,126,127,128,129,130,131,132,133,134,135,136,137,
            139,140,141,142,144,146,148,149,150,152,153,154,155,156,157,162,
            163,166,167,168,169,170,171,173,174,175,177,178,179,180,182,183,
            184,186,187,189,190,191,192,193,194,195,196,197,198,199,501,502,
            503,504,505,506,507,508,509,510,511,513,515,518,521,522,523,524,
            525,527,528,529,531,533,534,536,537,538,540,542,544,548
        ];

        const bank = document.getElementById('hero-bank');
        allHeroIds.forEach(id => {
            let img = document.createElement('img');
            img.src = `https://game.gtimg.cn/images/yxzj/img201605/heroimg/${id}/${id}.jpg`;
            img.className = 'hero-item';
            img.loading = "lazy"; // 延迟加载，防止卡顿
            img.onclick = () => addHero(img.src);
            bank.appendChild(img);
        });
    }

    function addHero(src) {
        const div = document.createElement('div');
        div.className = 'hero';
        div.style.left = '45%';
        div.style.top = '40%';
        div.style.backgroundImage = `url('${src}')`;
        board.appendChild(div);
        makeDraggable(div);
    }

    function makeDraggable(el) {
        let isMoving = false;
        let timer;
        const start = (e) => { 
            if(mode !== 'drag') return;
            isMoving = true; 
            el.style.zIndex = 1000;
            timer = setTimeout(() => { if(confirm('要移除这个英雄吗？')) el.remove(); }, 1000);
        };
        const move = (e) => {
            if(!isMoving) return;
            clearTimeout(timer);
            const evt = e.touches ? e.touches[0] : e;
            const rect = board.getBoundingClientRect();
            let x = evt.clientX - rect.left - 19;
            let y = evt.clientY - rect.top - 19;
            el.style.left = x + 'px';
            el.style.top = y + 'px';
        };
        const end = () => { isMoving = false; clearTimeout(timer); };
        
        el.addEventListener('mousedown', start);
        el.addEventListener('touchstart', start);
        window.addEventListener('mousemove', move);
        window.addEventListener('touchmove', move);
        window.addEventListener('mouseup', end);
        window.addEventListener('touchend', end);
    }

    function setMode(m) {
        mode = m;
        document.getElementById('dragBtn').className = m === 'drag' ? 'btn btn-active' : 'btn';
        document.getElementById('drawBtn').className = m === 'draw' ? 'btn btn-active' : 'btn';
        canvas.style.pointerEvents = m === 'draw' ? 'auto' : 'none';
    }

    let drawing = false;
    board.onpointerdown = (e) => { if(mode==='draw'){ drawing=true; ctx.beginPath(); ctx.moveTo(e.offsetX, e.offsetY); }};
    board.onpointermove = (e) => { if(drawing){ ctx.lineTo(e.offsetX, e.offsetY); ctx.stroke(); }};
    board.onpointerup = () => drawing = false;

    function clearAll() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        document.querySelectorAll('.hero').forEach(h => h.remove());
    }

    window.onload = init;
</script>
</body>
</html>
