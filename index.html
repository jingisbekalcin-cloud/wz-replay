<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>王者荣耀 S40 · 教练复盘板</title>

<style>
body {
  margin: 0;
  background: #020617;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
}
header {
  text-align: center;
  padding: 10px;
  font-weight: bold;
  background: #020617;
}
.tools {
  display: flex;
  justify-content: center;
  gap: 10px;
  padding: 10px;
}
button {
  padding: 6px 12px;
  font-size: 16px;
  border-radius: 6px;
  border: none;
}
#board {
  position: relative;
  width: 100%;
}
#board img {
  width: 100%;
  display: block;
}
.mark {
  position: absolute;
  font-size: 26px;
  user-select: none;
  touch-action: none;
}
</style>
</head>

<body>
<header>王者荣耀 S40 · 教练复盘板</header>

<div class="tools">
  <button onclick="addMark('❌')">❌ 错误</button>
  <button onclick="addMark('⭕')">⭕ 站位</button>
</div>

<div id="board">
  <!-- S40 峡谷地图 -->
<img src="Screenshot_20260110_150018_com.levelinfinite.gameGlobal.jpg" />
<script>
function addMark(text) {
  const m = document.createElement("div");
  m.className = "mark";
  m.innerText = text;
  m.style.left = "50%";
  m.style.top = "50%";

  let offsetX = 0, offsetY = 0;

  m.addEventListener("touchstart", e => {
    const t = e.touches[0];
    offsetX = t.clientX - m.offsetLeft;
    offsetY = t.clientY - m.offsetTop;
  });

  m.addEventListener("touchmove", e => {
    const t = e.touches[0];
    m.style.left = t.clientX - offsetX + "px";
    m.style.top = t.clientY - offsetY + "px";
    e.preventDefault();
  });

  document.getElementById("board").appendChild(m);
}
</script>

</body>
</html>
