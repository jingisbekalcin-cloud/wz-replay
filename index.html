<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>王者复盘工具-修复版</title>
    <style>
        :root { --primary: #fbda30; --bg: #0b1320; }
        body { margin: 0; background: var(--bg); color: white; font-family: sans-serif; touch-action: none; overflow: hidden; }
        header { text-align: center; padding: 10px; font-weight: bold; background: #020617; border-bottom: 1px solid #333; }
        
        .tools { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 10px; background: #020617; }
        .btn { background: #1e293b; color: white; border: none; padding: 8px 12px; border-radius: 6px; font-size: 13px; }
        .btn-active { background: var(--primary); color: #000; font-weight: bold; }

        /* 修复地图：增加备用背景色，防止图片加载失败时全黑 */
        #board {
            position: relative; width: 95vw; height: 53.4vw; 
            max-width: 800px; max-height: 450px;
            margin: 10px auto;
            background: #1c2a43 url('https://game.gtimg.cn/images/yxzj/img201605/summoner/map/map_5v5.jpg') no-repeat;
            background-size: 100% 100%; border: 1px solid #444;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .hero {
            position: absolute; width: 40px; height: 40px;
            border-radius: 50%; border: 2px solid #fff;
            z-index: 100; background-size: cover; background-color: #333;
        }

        /* 英雄库滚动条优化 */
        .hero-bank {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: #1a1a1a; padding: 10px;
            display: flex; overflow-x: auto; gap: 10px;
            border-top: 2px solid #333; height: 70px; align-items: center;
        }
        .hero-item { 
            width: 50px; height: 50px; border-radius: 50%; 
            border: 2px solid #444; flex-shrink: 0; 
            object-fit: cover; background: #222;
        }
    </style>
</head>
<body>

<header>王者荣耀复盘工具</header>

<div class="tools">
    <button class="btn btn-active" id="dragBtn" onclick="setMode('drag')">🖐️ 移动</button>
    <button class="btn" id="drawBtn" onclick="setMode('draw')">✏️ 画笔</button>
    <button class="btn" onclick="clearAll()" style="background:#7f1d1d;">🧹 清空</button>
</div>

<div id="board">
    <canvas id="paint-canvas"></canvas>
</div>

<div class="hero-bank" id="hero-bank"></div>

<script>
    const board = document.getElementById('board');
    const canvas = document.getElementById('paint-canvas');
    const ctx = canvas.getContext('2d');
    let mode = 'drag';

    function init() {
        canvas.width = board.clientWidth;
        canvas.height = board.clientHeight;
        ctx.strokeStyle = '#fbda30';
        ctx.lineWidth = 3;

        // 重新整理的英雄 ID (确保这些 ID 是官方库中存在的)
        const ids = [105, 106, 111, 112, 117, 124, 131, 140, 150, 154, 157, 167, 175, 182, 191, 196, 501, 513];
        const bank = document.getElementById('hero-bank');
        
        ids.forEach(id => {
            const img = document.createElement('img');
            // 使用 https 协议确保安全加载
            img.src = `https://game.gtimg.cn/images/yxzj/img201605/heroimg/${id}/${id}.jpg`;
            img.className = 'hero-item';
            // 增加加载失败处理
            img.onerror = function() { this.style.display = 'none'; };
            img.onclick = () => addHero(img.src);
            bank.appendChild(img);
        });
    }

    function addHero(src) {
        const div = document.createElement('div');
        div.className = 'hero';
        div.style.left = '45%';
        div.style.top = '40%';
        div.style.backgroundImage = `url('${src}')`;
        board.appendChild(div);
        
        // 拖拽逻辑
        let isMove = false;
        const start = () => isMove = (mode === 'drag');
        const move = (e) => {
            if(!isMove) return;
            const evt = e.touches ? e.touches[0] : e;
            const r = board.getBoundingClientRect();
            div.style.left = (evt.clientX - r.left - 20) + 'px';
            div.style.top = (evt.clientY - r.top - 20) + 'px';
        };
        const end = () => isMove = false;
        
        div.addEventListener('touchstart', start);
        window.addEventListener('touchmove', move);
        window.addEventListener('touchend', end);
        // PC端兼容
        div.addEventListener('mousedown', start);
        window.addEventListener('mousemove', move);
        window.addEventListener('mouseup', end);
    }

    function setMode(m) {
        mode = m;
        document.getElementById('dragBtn').className = m === 'drag' ? 'btn btn-active' : 'btn';
        document.getElementById('drawBtn').className = m === 'draw' ? 'btn btn-active' : 'btn';
        canvas.style.pointerEvents = m === 'draw' ? 'auto' : 'none';
    }

    let drawing = false;
    board.onpointerdown = (e) => { if(mode==='draw'){ drawing=true; ctx.beginPath(); ctx.moveTo(e.offsetX, e.offsetY); }};
    board.onpointermove = (e) => { if(drawing){ ctx.lineTo(e.offsetX, e.offsetY); ctx.stroke(); }};
    board.onpointerup = () => drawing = false;

    function clearAll() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        document.querySelectorAll('.hero').forEach(h => h.remove());
    }

    window.onload = init;
</script>
</body>
</html>
